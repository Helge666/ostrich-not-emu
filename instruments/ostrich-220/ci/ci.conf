# Ostrich 220 in CI (sourced by tools/ci/*.sh; bash).
NAME=Ostrich220
TITLE="Ostrich 220"
TAG=ostrich220                    # release tags: ostrich220-v1.2.3, ostrich220-preview-1.2.3
# mame is a large checkout; the core compiles a handful of files from it.
SUBMODULES=(third_party/dpf:recursive third_party/mame)
SMOKE_ENV=OSTRICH_ROMS
SMOKE_ARGS=(--seconds 1)
SMOKE_EXPECT=("plugin: Ostrich 220" "Missing: A, B, C, D, E, F, firmware" "state: saved")
LOGS=(plugin/build-u220/*.log plugin/ostrich/build-win/core/*.log)
