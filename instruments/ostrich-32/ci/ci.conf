# Ostrich 32 in CI (sourced by tools/ci/*.sh; bash).
NAME=Ostrich32
TITLE="Ostrich 32"
TAG=ostrich32                     # release tags: ostrich32-v1.2.3, ostrich32-preview-1.2.3
# path[:recursive]; all shallow. gearmulator NOT recursive: build_core.sh fetches the few
# nested submodules it needs.
SUBMODULES=(third_party/dpf:recursive third_party/gearmulator)
SMOKE_ENV=OSTRICH32_ROMS
SMOKE_ARGS=()
SMOKE_EXPECT=("plugin: Ostrich 32" "No MT-32 ROM images found" "state: saved")
LOGS=(plugin/build-core/*.log plugin/build-core/obj/*.log plugin/ostrich/build-win/core/*.log plugin/ostrich/build-win/core/obj/*.log)
