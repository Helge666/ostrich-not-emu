# Ostrich 55 in CI (sourced by tools/ci/*.sh; bash).
NAME=Ostrich55
TITLE="Ostrich 55"
TAG=ostrich55                     # release tags: ostrich55-v1.2.3, ostrich55-preview-1.2.3
SUBMODULES=(third_party/dpf:recursive third_party/nuked-sc55)
SMOKE_ENV=OSTRICH55_ROMS
SMOKE_ARGS=(--seconds 1)
SMOKE_EXPECT=("plugin: Ostrich 55" "Missing: CPU ROM, Program ROM, Wave ROM A, Wave ROM B, Wave ROM C" "state: saved")
LOGS=(plugin/build-core/*.log plugin/ostrich/build-win/core/*.log)
